services:
  - type: web
    name: deepfake-live-cam
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DECART_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://deepfake-live-cam.onrender.com
      - key: PRICE_PER_MIN
        value: "2"
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_IPS
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
